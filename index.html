<link rel="stylesheet" href="css/style.css">
<style id="kintsugi-repair">
/* ══ 金継ぎ追補スタイル kintsugi-repair.css(写しの修理デモ用・本体は無改変)══
   1巡目の3件: ①低コントラスト(元栓2本) ②文字段+極小(naoshi下書き流用) ③段落なしはDOM手当て(patch-after)側 */

/* [contrast・元栓] ライトテーマの琥珀 #C77800 → #945900(同色相・明度のみ下げた派生1色)。
   これ1本で 7件の低コントラスト(bc-here/updated-line/demo-title/tok-meta b/why b と、
   白文字×琥珀地のタブ #tab-*)をまとめて床4.5に載せる。全背景で検算済み(4.90〜5.69) */
:root[data-theme="light"] { --signal: #945900; }

/* [contrast・元栓] ライトテーマの青 #2563EB → #2059D6(同色相・明度のみ)。
   .analogy b(地#E4EAF9で4.3)を5.04へ。白地のリンクは6.07 */
:root[data-theme="light"] { --wave: #2059D6; }

/* [font] 役割「ボタン」の 13.5px を近いサイズ 15px へ寄せる（25%以内・一番使われている値へ） */
.pn-title { font-size: 15px; }
/* [font] 役割「ボタン」の 13px を近いサイズ 15px へ寄せる（25%以内・一番使われている値へ） */
.tab { font-size: 15px; }
/* [font] 役割「ボタン」の 11.5px を近いサイズ 12px へ寄せる（25%以内・一番使われている値へ・極小） ⚠inherited（祖先 .breadcrumb の規則を上書き＝配下全部に効く） */
.breadcrumb { font-size: 12px; }
/* [font] 役割「ボタン」の 11px を近いサイズ 12px へ寄せる（25%以内・一番使われている値へ・極小） */
.pn-dir { font-size: 12px; }
/* [font] 役割「本文」の 14.5px を近いサイズ 15px へ寄せる（25%以内・一番使われている値へ） ⚠inherited（祖先 .analogy の規則を上書き＝配下全部に効く） */
.analogy { font-size: 15px; }
/* [font] 役割「本文」の 14.5px を近いサイズ 15px へ寄せる（25%以内・一番使われている値へ） ⚠inherited（祖先 .doc-list の規則を上書き＝配下全部に効く） */
.doc-list { font-size: 15px; }
/* [font] 役割「本文」の 14px を近いサイズ 15px へ寄せる（25%以内・一番使われている値へ） */
.tab-lede { font-size: 15px; }
/* [font] 役割「本文」の 12.5px を近いサイズ 15px へ寄せる（25%以内・一番使われている値へ） */
.page-card p { font-size: 15px; }
/* [font] 役割「本文」の 12px を近いサイズ 15px へ寄せる（25%以内・一番使われている値へ） */
.tok-meta { font-size: 15px; }
/* [font] 役割「本文」の 12px を近いサイズ 15px へ寄せる（25%以内・一番使われている値へ） */
.demo-hint { font-size: 15px; }
/* [font] 役割「本文」の 11.5px を近いサイズ 12px へ寄せる（25%以内・一番使われている値へ・極小） */
.updated-line { font-size: 12px; }
/* [font] 役割「本文」の 11px を近いサイズ 12px へ寄せる（25%以内・一番使われている値へ・極小） ⚠inherited（祖先 .receiving の規則を上書き＝配下全部に効く） */
.receiving { font-size: 12px; }
/* [font] 役割「本文」の 11px を近いサイズ 12px へ寄せる（25%以内・一番使われている値へ・極小） */
.demo-title { font-size: 12px; }
/* [font] 役割「その他」の 13px を近いサイズ 13.5px へ寄せる（25%以内・一番使われている値へ） */
.tok-box { font-size: 13.5px; }
/* [font] 役割「その他」の 11px を近いサイズ 13.5px へ寄せる（25%以内・一番使われている値へ・極小） */
.analogy b { font-size: 13.5px; }
/* [font] 役割「その他」の 11px を近いサイズ 13.5px へ寄せる（25%以内・一番使われている値へ・極小） */
.why b { font-size: 13.5px; }
/* [radius] 角丸 3px を 5px へ（4種→3） */
.receiving-lamp { border-radius: 5px; }

/* [読みやすさ] 段落分け(patch-after)した例え話の段落間に間隔(元は margin:0 の1塊) */
.analogy p + p { margin-top: 8px; }
</style>
<style id="kintsugi-repair-2">
/* ══ 金継ぎ追補2(仕上げ: 角丸の統合。追補1は診断の検証済みCSSのため無改変で分離)══
   角丸5種(5/8/10/14/999) → 3種(10=小・14=面・999=pill)。
   .why 8→10 / .tok-box 5→10 / .receiving-lamp は6px円のため計算値も10に統一 */
.why { border-radius: 0 10px 10px 0; }
.tok-box { border-radius: 10px; }
.receiving-lamp { border-radius: 10px; }
/* [font] 代表ページ外で見つかった極小文字(補足ラベルの役割)を12pxへ:
   .chip 10.5px(カテゴリ札・用語辞典で83件) / .issue-date 11.5px / .src 11px(出典リンク) */
.chip { font-size: 12px; }
.issue-date { font-size: 12px; }
.src { font-size: 12px; }
.nl-priv { font-size: 12px; }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="#trends" aria-label="ANTENNA ホーム">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">

        <path class="wave wave-1" d="M7.5 6.5a6.5 6.5 0 0 1 9 0" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <path class="wave wave-2" d="M5 4a10 10 0 0 1 14 0" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>

    </button>
    <button class="theme-toggle" id="search-btn" aria-label="サイト内検索">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M15.8 15.8 20 20" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    </button>
    <button class="theme-toggle" id="theme-toggle" aria-label="テーマ切り替え">
      <svg viewBox="0 0 24 24" class="icon-sun" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <svg viewBox="0 0 24 24" class="icon-moon" aria-hidden="true"><path d="M20 13.5A8 8 0 0 1 10.5 4 8 8 0 1 0 20 13.5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <nav class="tab-bar" aria-label="カテゴリ">
    <div class="tab-scroll" id="tab-scroll" role="tablist"></div>
  </nav>
</header>

<main id="main" tabindex="-1">
  <div class="content" id="content" aria-live="polite">
    <p class="loading">受信しています…</p>
  </div>
</main>
